<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">NUCLEO-F446RE minimal LED wiring</title>
  <desc id="desc">A safe breadboard wiring diagram for one external LED controlled by Arduino D13 PA5 on NUCLEO-F446RE.</desc>
  <defs>
    <linearGradient id="board" x1="0" x2="1">
      <stop offset="0" stop-color="#1f8f5f"/>
      <stop offset="1" stop-color="#27b477"/>
    </linearGradient>
    <linearGradient id="breadboard" x1="0" x2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#f5f7fb"/>
  <text x="60" y="62" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#102033">Today&apos;s safe wiring: NUCLEO D13 -> resistor -> LED -> GND</text>
  <text x="60" y="100" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#475569">This mirrors the current firmware LED command because D13 is PA5 on the NUCLEO-F446RE Arduino header.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="158" width="380" height="470" rx="22" fill="url(#board)" stroke="#12633f" stroke-width="3"/>
    <rect x="105" y="202" width="100" height="70" rx="10" fill="#dbeafe" stroke="#0f4c81" stroke-width="3"/>
    <text x="118" y="243" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f4c81">ST-LINK</text>
    <rect x="244" y="202" width="150" height="106" rx="12" fill="#0f172a"/>
    <text x="279" y="263" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">STM32</text>
    <text x="142" y="350" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">NUCLEO-F446RE</text>
    <rect x="382" y="386" width="38" height="38" rx="8" fill="#facc15" stroke="#854d0e" stroke-width="3"/>
    <text x="368" y="448" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">LD2 PA5</text>

    <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
      <rect x="382" y="176" width="40" height="30" rx="6" fill="#eef2ff"/>
      <text x="391" y="197" fill="#1e293b">D13</text>
      <rect x="382" y="218" width="40" height="30" rx="6" fill="#eef2ff"/>
      <text x="392" y="239" fill="#1e293b">GND</text>
      <rect x="382" y="260" width="40" height="30" rx="6" fill="#eef2ff"/>
      <text x="391" y="281" fill="#1e293b">3V3</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="156" width="460" height="470" rx="24" fill="url(#breadboard)" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="650" y="190" width="400" height="26" rx="8" fill="#fee2e2"/>
    <rect x="650" y="568" width="400" height="26" rx="8" fill="#dbeafe"/>
    <text x="1070" y="211" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626">+</text>
    <text x="1070" y="589" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">-</text>
    <text x="746" y="350" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#334155">Breadboard</text>

    <g fill="#cbd5e1">
      <script type="application/ecmascript"><![CDATA[]]></script>
      <circle cx="690" cy="260" r="5"/><circle cx="730" cy="260" r="5"/><circle cx="770" cy="260" r="5"/><circle cx="810" cy="260" r="5"/><circle cx="850" cy="260" r="5"/><circle cx="890" cy="260" r="5"/><circle cx="930" cy="260" r="5"/><circle cx="970" cy="260" r="5"/>
      <circle cx="690" cy="300" r="5"/><circle cx="730" cy="300" r="5"/><circle cx="770" cy="300" r="5"/><circle cx="810" cy="300" r="5"/><circle cx="850" cy="300" r="5"/><circle cx="890" cy="300" r="5"/><circle cx="930" cy="300" r="5"/><circle cx="970" cy="300" r="5"/>
      <circle cx="690" cy="420" r="5"/><circle cx="730" cy="420" r="5"/><circle cx="770" cy="420" r="5"/><circle cx="810" cy="420" r="5"/><circle cx="850" cy="420" r="5"/><circle cx="890" cy="420" r="5"/><circle cx="930" cy="420" r="5"/><circle cx="970" cy="420" r="5"/>
      <circle cx="690" cy="460" r="5"/><circle cx="730" cy="460" r="5"/><circle cx="770" cy="460" r="5"/><circle cx="810" cy="460" r="5"/><circle cx="850" cy="460" r="5"/><circle cx="890" cy="460" r="5"/><circle cx="930" cy="460" r="5"/><circle cx="970" cy="460" r="5"/>
    </g>

    <rect x="734" y="248" width="92" height="24" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <path d="M735 260 L700 260" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
    <path d="M826 260 L860 260" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
    <text x="736" y="239" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#92400e">220R / 330R</text>

    <circle cx="890" cy="260" r="30" fill="#ef4444" stroke="#991b1b" stroke-width="4"/>
    <path d="M879 248 L901 272 M901 248 L879 272" stroke="#fecaca" stroke-width="4" stroke-linecap="round"/>
    <path d="M890 290 L890 420" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <path d="M890 420 L1020 420 L1020 568" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <text x="860" y="330" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#991b1b">LED</text>
    <text x="914" y="265" font-family="Arial, sans-serif" font-size="15" fill="#991b1b">long leg +</text>
    <text x="914" y="293" font-family="Arial, sans-serif" font-size="15" fill="#334155">short leg -</text>
  </g>

  <path d="M422 191 C505 168 565 194 650 260 L700 260" fill="none" stroke="#e11d48" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="486" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#be123c">red wire: D13 / PA5 signal</text>

  <path d="M422 233 C500 260 550 550 650 580 L1020 580" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="462" y="575" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">blue/black wire: GND</text>

  <rect x="72" y="660" width="1008" height="54" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="96" y="694" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#9a3412">Safety: never connect an LED directly to D13 without a resistor. Do not connect motors or buzzers directly to GPIO.</text>
</svg>
