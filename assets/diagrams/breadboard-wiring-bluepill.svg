<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#eef7ff"/>
      <stop offset="100%" stop-color="#edfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1e3a5f" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 800 42px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #132033; }
      .sub { font: 500 22px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #607084; }
      .label { font: 800 24px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #132033; }
      .small { font: 600 18px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 700 15px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0f172a; }
      .board { fill: #fff7ed; stroke: #fed7aa; stroke-width: 3; filter: url(#shadow); }
      .module { fill: rgba(255,255,255,0.96); stroke: #d7e4f2; stroke-width: 3; filter: url(#shadow); }
      .stm { fill: #0f766e; stroke: #075985; stroke-width: 5; filter: url(#shadow); }
      .hole { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; }
      .rail-red { stroke: #ef4444; stroke-width: 8; stroke-linecap: round; }
      .rail-blue { stroke: #2563eb; stroke-width: 8; stroke-linecap: round; }
      .wire-red { stroke: #ef4444; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-black { stroke: #111827; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-blue { stroke: #2563eb; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-green { stroke: #16a34a; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-yellow { stroke: #d97706; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-purple { stroke: #7c3aed; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-cyan { stroke: #0891b2; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pin { fill: #facc15; stroke: #92400e; stroke-width: 2; }
      .callout { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; }
      .danger { fill: #fff1f2; stroke: #fecdd3; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>
  <text x="70" y="72" class="title">面包板接线图：STM32 Blue Pill 新手版</text>
  <text x="70" y="112" class="sub">假设开发板是 STM32F103C8T6 Blue Pill。模块优先买带接口的版本，尽量不要第一天就焊接和自己搭驱动电路。</text>

  <!-- Breadboard -->
  <rect x="115" y="210" width="1030" height="630" rx="28" class="board"/>
  <text x="150" y="255" class="label">面包板</text>
  <line x1="165" y1="305" x2="1095" y2="305" class="rail-red"/>
  <line x1="165" y1="345" x2="1095" y2="345" class="rail-blue"/>
  <text x="175" y="296" class="tiny">红色电源轨：3.3V</text>
  <text x="175" y="382" class="tiny">蓝色电源轨：GND</text>

  <!-- holes -->
  <g opacity="0.8">
    <script type="application/ecmascript"><![CDATA[]]></script>
    <circle cx="190" cy="430" r="6" class="hole"/><circle cx="230" cy="430" r="6" class="hole"/><circle cx="270" cy="430" r="6" class="hole"/><circle cx="310" cy="430" r="6" class="hole"/><circle cx="350" cy="430" r="6" class="hole"/><circle cx="390" cy="430" r="6" class="hole"/><circle cx="430" cy="430" r="6" class="hole"/><circle cx="470" cy="430" r="6" class="hole"/><circle cx="510" cy="430" r="6" class="hole"/><circle cx="550" cy="430" r="6" class="hole"/><circle cx="590" cy="430" r="6" class="hole"/><circle cx="630" cy="430" r="6" class="hole"/><circle cx="670" cy="430" r="6" class="hole"/><circle cx="710" cy="430" r="6" class="hole"/><circle cx="750" cy="430" r="6" class="hole"/><circle cx="790" cy="430" r="6" class="hole"/><circle cx="830" cy="430" r="6" class="hole"/><circle cx="870" cy="430" r="6" class="hole"/><circle cx="910" cy="430" r="6" class="hole"/><circle cx="950" cy="430" r="6" class="hole"/><circle cx="990" cy="430" r="6" class="hole"/><circle cx="1030" cy="430" r="6" class="hole"/>
    <circle cx="190" cy="470" r="6" class="hole"/><circle cx="230" cy="470" r="6" class="hole"/><circle cx="270" cy="470" r="6" class="hole"/><circle cx="310" cy="470" r="6" class="hole"/><circle cx="350" cy="470" r="6" class="hole"/><circle cx="390" cy="470" r="6" class="hole"/><circle cx="430" cy="470" r="6" class="hole"/><circle cx="470" cy="470" r="6" class="hole"/><circle cx="510" cy="470" r="6" class="hole"/><circle cx="550" cy="470" r="6" class="hole"/><circle cx="590" cy="470" r="6" class="hole"/><circle cx="630" cy="470" r="6" class="hole"/><circle cx="670" cy="470" r="6" class="hole"/><circle cx="710" cy="470" r="6" class="hole"/><circle cx="750" cy="470" r="6" class="hole"/><circle cx="790" cy="470" r="6" class="hole"/><circle cx="830" cy="470" r="6" class="hole"/><circle cx="870" cy="470" r="6" class="hole"/><circle cx="910" cy="470" r="6" class="hole"/><circle cx="950" cy="470" r="6" class="hole"/><circle cx="990" cy="470" r="6" class="hole"/><circle cx="1030" cy="470" r="6" class="hole"/>
    <circle cx="190" cy="560" r="6" class="hole"/><circle cx="230" cy="560" r="6" class="hole"/><circle cx="270" cy="560" r="6" class="hole"/><circle cx="310" cy="560" r="6" class="hole"/><circle cx="350" cy="560" r="6" class="hole"/><circle cx="390" cy="560" r="6" class="hole"/><circle cx="430" cy="560" r="6" class="hole"/><circle cx="470" cy="560" r="6" class="hole"/><circle cx="510" cy="560" r="6" class="hole"/><circle cx="550" cy="560" r="6" class="hole"/><circle cx="590" cy="560" r="6" class="hole"/><circle cx="630" cy="560" r="6" class="hole"/><circle cx="670" cy="560" r="6" class="hole"/><circle cx="710" cy="560" r="6" class="hole"/><circle cx="750" cy="560" r="6" class="hole"/><circle cx="790" cy="560" r="6" class="hole"/><circle cx="830" cy="560" r="6" class="hole"/><circle cx="870" cy="560" r="6" class="hole"/><circle cx="910" cy="560" r="6" class="hole"/><circle cx="950" cy="560" r="6" class="hole"/><circle cx="990" cy="560" r="6" class="hole"/><circle cx="1030" cy="560" r="6" class="hole"/>
    <circle cx="190" cy="600" r="6" class="hole"/><circle cx="230" cy="600" r="6" class="hole"/><circle cx="270" cy="600" r="6" class="hole"/><circle cx="310" cy="600" r="6" class="hole"/><circle cx="350" cy="600" r="6" class="hole"/><circle cx="390" cy="600" r="6" class="hole"/><circle cx="430" cy="600" r="6" class="hole"/><circle cx="470" cy="600" r="6" class="hole"/><circle cx="510" cy="600" r="6" class="hole"/><circle cx="550" cy="600" r="6" class="hole"/><circle cx="590" cy="600" r="6" class="hole"/><circle cx="630" cy="600" r="6" class="hole"/><circle cx="670" cy="600" r="6" class="hole"/><circle cx="710" cy="600" r="6" class="hole"/><circle cx="750" cy="600" r="6" class="hole"/><circle cx="790" cy="600" r="6" class="hole"/><circle cx="830" cy="600" r="6" class="hole"/><circle cx="870" cy="600" r="6" class="hole"/><circle cx="910" cy="600" r="6" class="hole"/><circle cx="950" cy="600" r="6" class="hole"/><circle cx="990" cy="600" r="6" class="hole"/><circle cx="1030" cy="600" r="6" class="hole"/>
  </g>

  <!-- STM32 board -->
  <rect x="525" y="390" width="290" height="360" rx="18" class="stm"/>
  <rect x="585" y="500" width="170" height="80" rx="10" fill="#111827"/>
  <text x="626" y="548" fill="#9de7ff" font-size="28" font-weight="800" font-family="Segoe UI, Microsoft YaHei">STM32</text>
  <text x="590" y="610" fill="#d1fae5" font-size="22" font-weight="800" font-family="Segoe UI, Microsoft YaHei">Blue Pill</text>

  <!-- pins left -->
  <g>
    <rect x="500" y="420" width="24" height="20" class="pin"/><text x="410" y="437" class="tiny">3.3V</text>
    <rect x="500" y="465" width="24" height="20" class="pin"/><text x="410" y="482" class="tiny">GND</text>
    <rect x="500" y="510" width="24" height="20" class="pin"/><text x="410" y="527" class="tiny">PB6 SCL</text>
    <rect x="500" y="555" width="24" height="20" class="pin"/><text x="410" y="572" class="tiny">PB7 SDA</text>
    <rect x="500" y="600" width="24" height="20" class="pin"/><text x="410" y="617" class="tiny">PA0 按键</text>
  </g>
  <!-- pins right -->
  <g>
    <rect x="815" y="420" width="24" height="20" class="pin"/><text x="850" y="437" class="tiny">PA1 LED</text>
    <rect x="815" y="465" width="24" height="20" class="pin"/><text x="850" y="482" class="tiny">PA2 蜂鸣器</text>
    <rect x="815" y="510" width="24" height="20" class="pin"/><text x="850" y="527" class="tiny">PA3 震动</text>
    <rect x="815" y="555" width="24" height="20" class="pin"/><text x="850" y="572" class="tiny">PA9 TX</text>
    <rect x="815" y="600" width="24" height="20" class="pin"/><text x="850" y="617" class="tiny">PA10 RX</text>
  </g>

  <!-- Modules -->
  <rect x="1235" y="190" width="320" height="160" rx="20" class="module"/>
  <rect x="1300" y="240" width="190" height="70" rx="8" fill="#020617" stroke="#111827" stroke-width="8"/>
  <text x="1338" y="284" fill="#9df7ff" font-size="25" font-weight="800" font-family="Consolas">OLED</text>
  <text x="1265" y="375" class="label">OLED 模块 I2C</text>
  <text x="1265" y="405" class="small">VCC / GND / SCL / SDA</text>

  <rect x="1235" y="455" width="320" height="145" rx="20" class="module"/>
  <circle cx="1325" cy="515" r="36" fill="#22c55e" stroke="#166534" stroke-width="5"/>
  <text x="1390" y="523" class="label">按键模块</text>
  <text x="1265" y="628" class="small">VCC / GND / OUT</text>

  <rect x="1235" y="675" width="320" height="145" rx="20" class="module"/>
  <circle cx="1325" cy="735" r="28" fill="#22c55e"/>
  <text x="1390" y="743" class="label">LED + 电阻</text>
  <text x="1265" y="848" class="small">PA1 -> 220Ω -> LED -> GND</text>

  <rect x="1235" y="895" width="320" height="145" rx="20" class="module"/>
  <circle cx="1320" cy="955" r="28" fill="#111827"/>
  <path d="M1370 930 C1400 955, 1400 955, 1370 980" stroke="#f97316" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="1400" y="963" class="label">蜂鸣/震动模块</text>
  <text x="1265" y="1068" class="small">买“驱动模块”，不要裸接马达</text>

  <!-- USB TTL -->
  <rect x="170" y="910" width="300" height="130" rx="20" class="module"/>
  <text x="215" y="960" class="label">USB-TTL 串口模块</text>
  <text x="205" y="990" class="small">接电脑 USB</text>
  <text x="205" y="1020" class="small">TX / RX / GND 三根线</text>

  <!-- Wires power -->
  <path d="M500 430 C420 430, 360 305, 165 305" class="wire-red"/>
  <path d="M500 475 C420 475, 360 345, 165 345" class="wire-black"/>
  <path d="M1235 245 C1120 245, 1100 305, 1095 305" class="wire-red"/>
  <path d="M1235 290 C1120 290, 1110 345, 1095 345" class="wire-black"/>
  <path d="M1235 505 C1120 505, 1110 305, 1095 305" class="wire-red"/>
  <path d="M1235 550 C1120 550, 1110 345, 1095 345" class="wire-black"/>
  <path d="M1235 945 C1120 945, 1110 305, 1095 305" class="wire-red"/>
  <path d="M1235 990 C1120 990, 1110 345, 1095 345" class="wire-black"/>

  <!-- Wires signal -->
  <path d="M500 520 C980 520, 1030 275, 1235 275" class="wire-blue"/>
  <text x="920" y="246" class="tiny">PB6 -> OLED SCL</text>
  <path d="M500 565 C985 565, 1030 315, 1235 315" class="wire-cyan"/>
  <text x="925" y="340" class="tiny">PB7 -> OLED SDA</text>
  <path d="M500 610 C1000 610, 1070 575, 1235 575" class="wire-green"/>
  <text x="930" y="600" class="tiny">PA0 -> 按键 OUT</text>
  <path d="M839 430 C1020 430, 1110 735, 1235 735" class="wire-yellow"/>
  <text x="955" y="710" class="tiny">PA1 -> 220Ω -> LED</text>
  <path d="M839 475 C1010 475, 1070 930, 1235 930" class="wire-purple"/>
  <text x="935" y="928" class="tiny">PA2 -> 蜂鸣器模块 IN</text>
  <path d="M839 520 C1020 520, 1095 1010, 1235 1010" class="wire-cyan"/>
  <text x="925" y="1038" class="tiny">PA3 -> 震动模块 IN</text>

  <!-- UART wires -->
  <path d="M839 565 C760 900, 600 950, 470 950" class="wire-blue"/>
  <text x="525" y="910" class="tiny">PA9 TX -> USB-TTL RX</text>
  <path d="M839 610 C760 955, 600 1005, 470 1005" class="wire-green"/>
  <text x="525" y="1008" class="tiny">PA10 RX -> USB-TTL TX</text>
  <path d="M500 475 C380 725, 330 850, 320 910" class="wire-black"/>
  <text x="240" y="885" class="tiny">GND 共地</text>

  <!-- Callouts -->
  <rect x="70" y="145" width="520" height="58" rx="16" class="callout"/>
  <text x="95" y="181" class="small">重要：红轨接 3.3V，蓝轨接 GND。STM32 的 GPIO 默认按 3.3V 逻辑使用。</text>

  <rect x="1125" y="85" width="540" height="80" rx="16" class="danger"/>
  <text x="1150" y="120" class="label">不要这样接</text>
  <text x="1150" y="150" class="small">不要把震动马达直接插到 STM32 引脚；买带三极管/驱动的震动模块。</text>

  <rect x="70" y="1080" width="1660" height="70" rx="18" class="callout"/>
  <text x="95" y="1118" class="small">如果你买的是 Nucleo、ESP32 或别的 STM32 板子，引脚名会变。把板子正反面照片发我，我可以按你的实物重画一版。</text>
</svg>
